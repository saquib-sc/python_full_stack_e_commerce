<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="background-color: cornflowerblue;">
    <div style="max-width: 400px; margin: 50px auto; background-color: aquamarine; padding: 50px; border-radius: 10px;">
        {% if error %}
             <p>{{error}}</p>
            {% endif %}
        <form action=" " method="POST">
            {% csrf_token %}
            <label for="" >Username</label>
            <input type="text" name="Username" style="border-radius: 3px;">
            <br><br>
            <label for="">Password</label>
            <input type="text" required name="Password" style="border-radius: 3px;">
            <br><br>
            <button type="submit" style="width: 80px; height: 30px; border-radius: 10px; background-color:deepskyblue;">Submit</button>
        </form>
    </div>
</body>
</html>
