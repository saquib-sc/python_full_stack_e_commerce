<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body style="background-color: aqua;">
    <div>
        <h2>Welcome</h2>
        <h2>{{ request.user.username }}</h2>

        <a href="{% url 'home' %}">Go to Home (View Products)</a>

        <form action="{% url 'logout' %}" method="post" style="margin-top: 10px;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </div>

    <hr>

    <div id="add-product-div">
        <h3>Add New Product</h3>

        {% if product_error %}
            <p style="color: red;">{{ product_error }}</p>
        {% endif %}

        <form method="post" action="{% url 'dashboard' %}">
            {% csrf_token %}
            <div>
                <label for="id_name">Product Name (max 25 chars):</label><br>
                <input type="text" id="id_name" name="name" maxlength="25" value="{{ name|default:'' }}" required>
            </div>
            <br>
            <div>
                <label for="id_price">Price:</label><br>
                <input type="number" id="id_price" name="price" step="0.01" min="0" value="{{ price|default:'' }}" required>
            </div>
            <br>
            <div>
                <label for="id_description">Description:</label><br>
                <textarea id="id_description" name="description" rows="3" required>{{ description|default:'' }}</textarea>
            </div>
            <br>
            <button type="submit">Add Product</button>
        </form>
    </div>
</body>
</html>
